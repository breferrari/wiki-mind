name: CI

on:
  push:
    branches: [main]
  pull_request:

# The shard installs on Windows, macOS and Linux, and Invariant 1 compares
# bytes, so every check runs on all three. Windows matters most: its runners
# check out with core.autocrlf=true, the setting that would turn LF into CRLF
# if .gitattributes stopped pinning it.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The engine version CI validates with. Keep it at or above the
      # `requires.shardmind` floor in .shardmind/shard.yaml once that exists.
      SHARDMIND_VERSION: 0.1.7
    steps:
      - uses: actions/checkout@v4

      - name: Line endings are LF
        shell: bash
        run: |
          # `git ls-files --eol` prints the index and working-tree endings of
          # every tracked file. Any CRLF, in the repo or in this checkout,
          # breaks the byte comparison an install is held to.
          bad=$(git ls-files --eol | grep -E '(^| )(i|w)/(crlf|mixed)( |$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::files with CRLF line endings (see .gitattributes)"
            echo "$bad"
            exit 1
          fi

      - name: No agent-session artifacts in tracked files
        shell: bash
        run: |
          # CONTRIBUTING.md hard rule 1. Session URLs, session trailers and
          # local absolute paths never land in the repo. The path patterns
          # need a real segment after the root and the trailer must start a
          # line, so the rule's own text (`C:\...`, `/Users/...`, a
          # `Claude-Session:` mention mid-sentence) doesn't match.
          pattern='claude\.ai/(code/)?session|^Claude-Session:|[A-Za-z]:\\[A-Za-z0-9_]|/Users/[A-Za-z0-9_]|/home/[A-Za-z0-9_]'
          hits=$(git grep -nIE "$pattern" || true)
          if [ -n "$hits" ]; then
            echo "::error::agent-session artifacts or local paths in tracked files"
            echo "$hits"
            exit 1
          fi

      - name: take-next selftest
        # Runs only while the in-repo copy exists: take-next is moving to a
        # global skill (#31), and this step leaves with the copy.
        if: hashFiles('.claude/skills/take-next/selftest.sh') != ''
        shell: bash
        # The loop's selection and pre-flight are jq inside shell, so this
        # fixture suite is their only test. It is offline: no gh, no network.
        run: sh .claude/skills/take-next/selftest.sh

      - uses: actions/setup-node@v4
        if: hashFiles('.shardmind/shard.yaml') != ''
        with:
          node-version: 22

      - name: shardmind validate
        if: hashFiles('.shardmind/shard.yaml') != ''
        shell: bash
        run: npx --yes "shardmind@${SHARDMIND_VERSION}" validate

      - name: shardmind validate (skipped, no manifest yet)
        if: hashFiles('.shardmind/shard.yaml') == ''
        shell: bash
        run: echo "::notice::.shardmind/shard.yaml does not exist yet; shardmind validate is skipped."
