# yaml-language-server: $schema=https://raw.githubusercontent.com/breferrari/shardmind/main/schemas/shard-schema.schema.json

schema_version: 1

# ---------------------------------------------------------------------------
# Values (SPEC.md §4). Every value has a default, and the defaults are what a
# clone gets (Invariant 1). The personalize hook (#17) uses the two strings;
# the engine skips it on an all-defaults install (Invariant 2).
# ---------------------------------------------------------------------------

values:
  user_name:
    type: string
    message: "Your name"
    placeholder: "Ada Researcher"
    default: ""
    group: setup

  research_focus:
    type: string
    message: "What is this wiki about?"
    hint: "One line. It heads Index.md and tells search what the vault holds."
    placeholder: "Retrieval-augmented generation"
    default: ""
    group: setup

  qmd_enabled:
    type: boolean
    message: "Enable QMD semantic search?"
    hint: "Requires: npm install -g @tobilu/qmd"
    default: true
    group: setup

groups:
  - id: setup
    label: "Quick Setup"
    description: "Three questions. Press Enter after each."

# ---------------------------------------------------------------------------
# Modules (SPEC.md §5). wiki and claude stay; codex and gemini are removable
# (#25). AGENTS.md, the one instruction file every agent reads (SPEC.md §6.1),
# is claimed by no module and so always installs, as do `.claude/scripts/`
# and `.claude/extensions/`: the hooks resolve into them whatever agent runs
# them.
# ---------------------------------------------------------------------------

modules:
  wiki:
    label: "The wiki: sources, concepts, entities, syntheses, questions, inbox, Bases, Index"
    paths:
      - "sources/"
      - "concepts/"
      - "entities/"
      - "syntheses/"
      - "questions/"
      - "inbox/"
      - "bases/"
      - "templates/"
      - "Index.md"
    removable: false

  claude:
    label: "Claude Code: its rules, commands, skills, the mod and the hook wiring"
    paths:
      - ".claude/rules/"
      - ".claude/commands/"
      - ".claude/skills/"
      - ".claude/settings.json"
      - ".claude/VENDOR.json"
    removable: false

  codex:
    label: "Codex (OpenAI): its hook config. Codex reads AGENTS.md itself."
    paths:
      - ".codex/"
    removable: true

  gemini:
    label: "Gemini (Google): its settings, which point it at AGENTS.md and wire its hooks"
    paths:
      - ".gemini/"
    removable: true
